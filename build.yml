name: Build ColorWars Plugin

# 코드를 GitHub에 push하거나, Actions 탭에서 수동으로 눌러도 실행됨
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Maven으로 빌드
        run: mvn -B clean package

      - name: 빌드된 jar 업로드 (Actions 탭에서 다운로드 가능)
        uses: actions/upload-artifact@v4
        with:
          name: ColorWars-jar
          path: target/ColorWars.jar
